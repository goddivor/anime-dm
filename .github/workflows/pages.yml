name: Website

# Builds site/ and publishes it on GitHub Pages, at goddivor.github.io/anime-dm/.
# A push to the release branch republishes it, so the download links follow
# each version read from CMakeLists.txt.
on:
  push:
    branches: [feature/win32-cpp]
    paths: ["site/**", "CMakeLists.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
