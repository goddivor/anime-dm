<form class="contact-form" id="contact-form" action="https://github.com/goddivor/anime-dm/issues/new" data-labels="Sujet|Version d'ADM|Windows">
  <label>Sujet
    <select name="topic">
      <option>Installation et mises à jour</option>
      <option>Intégration au navigateur</option>
      <option>Sources et Addon Store</option>
      <option>Téléchargements et lecteurs</option>
      <option>Planificateur et animés suivis</option>
      <option>Suggestion</option>
      <option>Autre</option>
    </select>
  </label>
  <label>Titre
    <input name="title" required placeholder="Résumez le problème">
  </label>
  <label>Version d'ADM
    <input name="version" placeholder="Aide › À propos, par exemple 0.02">
  </label>
  <label>Version de Windows
    <input name="windows" placeholder="Windows 10 ou Windows 11">
  </label>
  <label class="full">Description
    <textarea name="details" required placeholder="Ce que vous faisiez, ce qui s'est passé, ce que vous attendiez, et l'adresse de la page concernée"></textarea>
  </label>
  <div class="actions">
    <button class="btn btn-solid" type="submit">Préparer la demande</button>
    <p>Ou directement sur <a href="https://github.com/goddivor/anime-dm/issues">GitHub</a>.</p>
  </div>
</form>
