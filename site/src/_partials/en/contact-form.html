<form class="contact-form" id="contact-form" action="https://github.com/goddivor/anime-dm/issues/new" data-labels="Topic|ADM version|Windows">
  <label>Topic
    <select name="topic">
      <option>Installation and updates</option>
      <option>Browser integration</option>
      <option>Sources and Addon Store</option>
      <option>Downloads and players</option>
      <option>Scheduler and followed animes</option>
      <option>Suggestion</option>
      <option>Other</option>
    </select>
  </label>
  <label>Title
    <input name="title" required placeholder="Sum up the problem">
  </label>
  <label>ADM version
    <input name="version" placeholder="Help › About, for example 0.02">
  </label>
  <label>Windows version
    <input name="windows" placeholder="Windows 10 or Windows 11">
  </label>
  <label class="full">Description
    <textarea name="details" required placeholder="What you were doing, what happened, what you expected, and the address of the page concerned"></textarea>
  </label>
  <div class="actions">
    <button class="btn btn-solid" type="submit">Prepare the request</button>
    <p>Or straight on <a href="https://github.com/goddivor/anime-dm/issues">GitHub</a>.</p>
  </div>
</form>
