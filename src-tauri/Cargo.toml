[package]
name = "anime-dm"
version = "0.3.0"
description = "Anime Download Manager — gestionnaire de téléchargement type IDM pour sites d'animés (voir-anime.to en premier)"
edition = "2021"

[lib]
name = "anime_dm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

# --- HTTP (téléchargement de l'index/wasm/images ; le scraping est dans les addons) ---
reqwest = "0.13"
regex = "1"

# --- Addons (sources de sites en WASM, chargées via Extism) ---
addon-api = { path = "addon-api" }
extism = "1"

# --- Divers ---
anyhow = "1"
base64 = "0.22.1"
rusqlite = { version = "0.32", features = ["bundled"] }
