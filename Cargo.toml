[package]
name = "anime-dm"
version = "0.1.0"
edition = "2021"
description = "Anime Download Manager — gestionnaire de téléchargement type IDM pour sites d'animés (voir-anime.to en premier)"

[dependencies]
# --- GUI ---
eframe = "0.34"
egui_extras = "0.34"

# --- Async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

# --- HTTP / scraping ---
# Features par défaut = TLS système (native-tls/openssl) ; `json` pour l'endpoint meta mail.ru.
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.27"
regex = "1"

# --- Sérialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Navigateur headless (extraction des hébergeurs dont la source est générée en JS : VOE…) ---
chromiumoxide = "0.9"
futures = "0.3"

# --- Divers ---
anyhow = "1"
image = { version = "0.25.10", default-features = false, features = ["bmp"] }

[profile.release]
opt-level = 2
